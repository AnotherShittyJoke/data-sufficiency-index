<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ОКН Пскова</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font:14px system-ui;margin:0;background:#f4f6f8;color:#17202a}header{background:#17324d;color:white;padding:18px 24px}main{max-width:1400px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.card{background:white;border:1px solid #dce2e8;border-radius:10px;padding:14px;margin-bottom:12px}#map{height:560px;border-radius:8px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi b{display:block;font-size:25px}input,select,button{padding:7px;border:1px solid #cbd5df;border-radius:6px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #e4e8ed;text-align:left}tbody tr:hover{background:#eef5fb;cursor:pointer}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><h1>ОКН Пскова — предварительная оценка данных</h1><div>Автономный dashboard. Пустые значения не интерпретируются как подтверждённые.</div></header><main><div class="tools"><input id="q" placeholder="Поиск по ОКН"><select id="source"><option value="">Все источники</option></select><button id="reset">Сбросить</button><button id="csv">Экспорт CSV</button></div><section class="kpis" id="kpis"></section><div class="grid"><div class="card"><h2>Карта</h2><div id="map"></div></div><div class="card" id="detail"><h2>Карточка объекта</h2><p>Выберите строку таблицы или маркер.</p></div></div><div class="card"><h2>Реестр объектов</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Название</th><th>Адрес</th><th>Источник</th><th>Координаты</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const DATA=/*__DATA__*/[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const map=L.map('map').setView([57.82,28.33],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let layer=L.layerGroup().addTo(map);const sources=[...new Set(DATA.map(x=>x.source).filter(Boolean))];sources.forEach(x=>$('source').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));function render(){const q=$('q').value.toLowerCase(),src=$('source').value;const rows=DATA.filter(x=>(!q||Object.values(x).join(' ').toLowerCase().includes(q))&&(!src||x.source===src));$('kpis').innerHTML=[['Объектов',rows.length],['С координатами',rows.filter(x=>x.latitude&&x.longitude).length],['С источником',rows.filter(x=>x.source).length],['С адресом',rows.filter(x=>x.address).length],['Неполных',rows.filter(x=>!x.name||!x.object_id).length]].map(x=>`<div class="card kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');$('rows').innerHTML=rows.map((x,i)=>`<tr data-i="${DATA.indexOf(x)}"><td>${esc(x.object_id)}</td><td>${esc(x.name)}</td><td>${esc(x.address)}</td><td>${esc(x.source)}</td><td>${x.latitude&&x.longitude?'да':'нет'}</td></tr>`).join('');layer.clearLayers();rows.forEach(x=>{if(x.latitude&&x.longitude)L.marker([+x.latitude,+x.longitude]).addTo(layer).bindPopup(`<b>${esc(x.name||x.object_id)}</b><br>${esc(x.address)}<br>Источник: ${esc(x.source)}`).on('click',()=>detail(x))});document.querySelectorAll('tbody tr').forEach(r=>r.onclick=()=>detail(DATA[+r.dataset.i]))}function detail(x){$('detail').innerHTML='<h2>Карточка объекта</h2>'+Object.entries(x).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>`<p><b>${esc(k)}</b>: ${esc(v)}</p>`).join('')}function download(){const cols=DATA.length?Object.keys(DATA[0]):[];const text=[cols.join(','),...DATA.map(x=>cols.map(k=>`\"${String(x[k]??'').replaceAll('\"','\"\"')}\"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='okn.csv';a.click()}$('q').oninput=render;$('source').onchange=render;$('reset').onclick=()=>{$('q').value='';$('source').value='';render()};$('csv').onclick=download;render();</script></body></html>
