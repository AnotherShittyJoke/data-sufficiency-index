<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Карточка ОКН</title><style>body{font:15px system-ui;margin:0;background:#f5f7fa;color:#172b4d}main{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e1e8ef;border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 8px 24px #102a4312}a{color:#1769aa}.hero{display:grid;grid-template-columns:1fr 1fr;gap:18px}.photo{min-height:260px;border-radius:10px;background:#e8eef5;display:grid;place-items:center;color:#718096}.photo img{width:100%;height:100%;max-height:420px;object-fit:cover;border-radius:10px}.field{display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid #edf1f5;padding:8px 0}.muted{color:#718096}@media(max-width:700px){.hero{grid-template-columns:1fr}.field{grid-template-columns:1fr}}</style><main><p><a href="/">← Вернуться к реестру</a></p><div id="app"></div></main><script>const API='http://127.0.0.1:8780';const DATA=/*__DATA__*/[];const id=new URLSearchParams(location.search).get('id');const x=DATA.find(o=>String(o.object_id)===String(id))||DATA[0];const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));if(!x){document.getElementById('app').innerHTML='<div class="card">Объект не найден</div>'}else{const fields=['object_id','name','address','object_type','heritage_category','dating','style_or_function','function','protection_status','subject_of_protection','source','verification_status','publication_date','acquired_at','assessment_index','index_status','completeness','actuality','uncertainty','missing'];document.title=x.name||'Карточка ОКН';document.getElementById('app').innerHTML=`<div class="card"><h1>${esc(x.name||x.object_id)}</h1><p class="muted">Предварительная карточка объекта культурного наследия</p><div class="hero"><div class="photo"><a class="photo-search" href="${esc(x.photo_search_url||'#')}" target="_blank">Открыть фотографии в Яндекс.Картинках</a>${x.photo_url?`<img src="${esc(x.photo_url)}" alt="Фото или карточка источника" onerror="this.parentElement.innerHTML='Фото источника недоступно'">`:'Фото из открытого источника не найдено'}</div><div><h2>Индекс оценки</h2><h1>${esc(x.assessment_index??'—')} / 100</h1><p>${esc(x.index_status||'')}</p><p>Полнота: ${esc(x.completeness)}%</p><p>Актуальность: ${esc(x.actuality)}%</p><p>Неопределённость: ${esc(x.uncertainty)}%</p></div></div></div><div class="card"><h2>Базовые и найденные сведения</h2>${fields.map(k=>`<div class="field"><b>${esc(k)}</b><span>${esc(x[k]||'нет данных')}</span></div>`).join('')}</div><div class="card"><h2>Поиск по данным объекта</h2><input id="search" placeholder="Например: состояние, охранный предмет, адрес" style="width:100%"><select id="group" style="margin-top:8px;width:100%"><option value="">Все группы</option><option value="technical">Технические</option><option value="legal">Правовые</option><option value="urban">Градостроительные</option><option value="investment">Современное использование</option><option value="spatial">Пространственные</option><option value="provenance">Источники и актуальность</option></select><div id="hits"></div></div><div class="card"><h2>Поиск и дополнение сведений</h2><p class="muted">Приложение сопоставляет локальные значения с внешними источниками. Неподтверждённые результаты требуют проверки.</p><div class="enrich-buttons"><button onclick="enrich('technical')">Технические</button><button onclick="enrich('legal')">Правовые</button><button onclick="enrich('urban')">Градостроительные</button><button onclick="enrich('investment')">Современное использование</button><button onclick="enrich('all')">Найти всё</button></div><div id="enrichResult"></div></div><div class="card"><h2>Источники и верификация</h2><p>Источник значения: ${esc(x.source||'не указан')}</p><p>Официальная карточка: ${x.photo_url?`<a href="${esc(x.photo_url)}" target="_blank"> </a>`:'нет ссылки'}</p><p>Поиск открытых фотографий: ${x.photo_search_url?`<a href="${esc(x.photo_search_url)}" target="_blank">найти изображения в Яндекс.Картинки</a>`:'нет ссылки'}</p><p>Статус проверки: ${esc(x.verification_status||'требует проверки')}</p><p class="muted">Данные из ОSM используются только как вспомогательные сведения и не подтверждают юридический статус.</p></div>`;const groups={technical:['technical_condition','building_info','area'],legal:['protection_status','subject_of_protection','legal_restrictions'],urban:['urban_context','transport_access','land_info'],investment:['current_use','available_premises','owner_info'],spatial:['latitude','longitude','address'],provenance:['source','publication_date','acquired_at','verification_status']};function searchFields(){let q=document.getElementById('search').value.toLowerCase(),g=document.getElementById('group').value,keys=g?groups[g]:Object.keys(x);let hits=keys.filter(k=>String(x[k]??'').toLowerCase().includes(q)&&String(x[k]??'').trim()).map(k=>`<div class=field><b>${esc(k)}</b><span>${esc(x[k])}</span></div>`).join('');document.getElementById('hits').innerHTML=hits||'<p class=muted>Совпадений не найдено</p>'}document.getElementById('search').oninput=searchFields;document.getElementById('group').onchange=searchFields;searchFields();fetch(API+'/api/photo?id='+encodeURIComponent(x.object_id)).then(r=>r.json()).then(photo=>{let box=document.querySelector('.photo');if(photo.found){box.innerHTML=`<img src="${esc(photo.thumbnail)}" alt="Фото из Яндекс.Картинки"><small><a href="${esc(photo.source_url)}" target="_blank">Источник: Яндекс.Картинки</a>${photo.license?' · '+esc(photo.license):''}</small>`}else{box.innerHTML='<span>Фото не найдено в Яндекс.Картинки</span>'}}).catch(()=>{});}function enrich(group){document.getElementById('enrichResult').innerHTML='<p class=muted>Проверка источников</p>';fetch(API+'/api/enrich?id='+encodeURIComponent(x.object_id)+'&group='+group).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{let values=(data.values||[]).map(v=>`<div class=field><b>${esc(v.field)}</b><span>${esc(v.value||'нет данных')} · ${esc(v.verification)}</span></div>`).join('');let links=(data.links||[]).map(v=>`<li><a href="${esc(v.url)}" target="_blank">${esc(v.title)}</a> <small>${esc(v.status)}</small></li>`).join('');document.getElementById('enrichResult').innerHTML=`<h3>Найденные параметры</h3>${values}<h3>Источники для проверки</h3><ul>${links}</ul><p class=muted>${esc(data.note)}</p>`;if(data.calculated&&data.calculated.assessment_index!==undefined){x.assessment_index=data.calculated.assessment_index;const indexNode=document.querySelector('.hero h1');if(indexNode)indexNode.textContent=String(x.assessment_index)+' / 100';} }).catch(()=>document.getElementById('enrichResult').textContent='Поиск временно недоступен')}</script></html>
