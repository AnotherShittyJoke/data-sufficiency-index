 ул. Конная, д. 3", "region": "", "city": "", "latitude": 57.8183593, "longitude": 28.3243067, "object_type": "Ансамбль", "heritage_category": "Федерального значения", "dating": "XVII-XX вв.", "protection_status": "нет", "area": "", "building_info": "", "land_info": "", "technical_condition": "", "subject_of_protection": "В проект описания  предмета охраны объекта культурного наследия федерального значения «Усадьба Батова» входит:местоположение усадьбы  у моста на левом берегу реки Великой в районе Завеличья;градостроительный акцент силуэта усадьбы в застройке Завеличья и набережной;   планировочная композиция построек усадьбы: группировка строений вокруг двух смежных дворов;  планировочная  композиция объединенных в единое пространство под общей крышей построек: трехчастная планировочная структура древнего жилого дома, расположенного в юго-восточной части усадьбы,  двухчастная планировочная структура бывшей хозяйственной постройки, часть древнего дворового флигеля;постройки усадьбы, образующие первый двор:  2-х этажный жилой  дом, 2-х – этажный  флигель и хозяйственные постройки, конюшня, каретный сарай;  постройки усадьбы, образующие второй двор:  здание  домовой церкви и пристроенные  к ней по периметру двора  хозяйственные постройки.Дом жилой:местоположение здания в восточной и юго-восточной части  комплекса построек  «Усадьбы Батова»,  ориентация  восточного и юго-восточного фасадов,  на реку Великую,  расположение юго-восточного фасада вдоль ул. Конная (бывшая Изборская дорога);объемно-пространственная композиция двух двухэтажных каменных  корпусов, примыкающих друг к другу под тупым углом и двухэтажной каменной  башни, увенчанной сложным куполообразным покрытием с небольшим шпилем и люкарнами;архитектурная композиция южного и юго-восточного фасадов, решенных  в стиле эклектики, ее  подчинение линейной схеме, вертикальный акцент угловой башни в композиции юго-восточного фасада,  рустовка первого этажа  по штукатурке;архитектурный декор юго-восточного фасада: междуэтажная профилированная тяга,  простая карнизная тяга с дентикулами,  сандрики над окнами первого этажа,  имитирующие  каменные блоки, уложенные в веерный замок, декоративное обрамление окон второго этажа: имитация стрельчатой каменной  арочки  над окнами, опирающейся на  витые колонки - наличники, утопленные в толщу стены, заполнение пространства  арочек венками и лентами, заполнение пространства под окнами с имитацией тканных драпировок; аркатура, украшающая верх стен башни;ажурная кованная решетка в стиле модерн на окне справа от входа на юго-восточном фасаде, кованые кронштейны для флагов;симметрично-осевая архитектурная композиция главного восточного и северного фасадов, решенных в стиле неоклассицизма с элементами модерна:   архитектурная композиция восточного фасада, состоящая из центральной части с криволинейным завершением, украшенной живописным панно из керамики и фланкирующих неглубоких ризалитов, завершенных                 ступенчатым аттиком;  архитектурная композиция северного фасада, состоящая из ризалита,  завершенного ступенчатым аттиком и равновеликих боковых крыльев;архитектурный декор восточного и северного  фасадов:  филенки с растительным орнаментом  и  полукруглые панно с венками и лентами над окнами 1-го этажа,  сандрики с кронштейнами над окнами 2-го этажа и дверным проемом,  профилированная междуэтажная тяга с иониками,    криволинейный карниз над завершением центральной части,  лепные кронштейны балкона,   лепной декор аттика,  круглые розетки с орнаментом в виде паутинки; местоположение и габариты первоначальных оконных и дверных проемов; материал, местоположение, габариты, конструкция  балконов;живописное панно из  керамики, изображающее псковский Кремль с собором и плывущие по реке суда;  кованные оконные решетки с орнаментом в стиле модерн;   кованная орнаментальная парапетная решетка северного фасада;планировочная структура: планировка в пределах капитальных стен, анфиладная  система связи помещений,  «Г» - образное очертание  северо-восточной части дома в плане,  ориентация парадных комнат северо-восточной части дома на север и восток,  к реке;  лестницы черного хода, холла и коридора - на запад, идентичность планировки первого и второго этажей;сохранившиеся элементы декора в интерьерах:  панели из искусственного мрамора, лепной декор, чугунные кованые перила лестничных маршей в лестничном холле парадного вестибюля,  метлахская плитка;габариты и форма сложной крыши;  остатки  каменной постройки конца XVII -  начала XVIII в. в подвальном и первом этажах здания,  конструкция перекрытий этой постройки - каменные своды;материал  деталей декора – штукатурный раствор на основе цемента,  характер  отделки фасадов – штукатурка;  материал стен – известняковая плита, кирпич;  тип фундаментов, глубина заложения.Церковь домовая:объемно-пространственная композиция здания (без пристройки);композиция фасадов: асимметрия; основные вертикальные и горизонтальные членения;  архитектурное  решение парадного входа в здание; форма и габариты оконных и дверных проемов;все сохранившиеся элементы декора фасадов, независимо от степени их сохранности: лопатки, горизонтальные тяги, дентикулы, филенки с лепными вставками, оконные наличники;характер фасадной отделки: использование штукатурки в уровне цокольного этажа, сочетание открытой лицевой кладки с расшивкой швов и оштукатуренных элементов декора в уровне основного объема здания;планировка в пределах капитальных стен;пространственные характеристики основных помещений здания: парадной и служебной лестничных клеток, фойе, двусветного зала с выделенной алтарной частью и хорами;лестничные клетки: материал и конструкция парадной и служебной лестниц; литые лестничные ограждения; точеные деревянные перила; метлахская плитка на лестничных площадках; лепные орнаментированные потолочные фризы;двусветный зал: стилизованные чугунные колонны в форме лотоса; лепнина в оформлении оконных и дверных проемов, потолка и стен; кронштейны в форме валют, поддерживающие хоры; кованые ог риты и конфигурация прямоугольного в плане 2-х этажного на подклете здания;- историческая форма, габариты и конфигурация четырехскатной крыши с печными трубами и слуховыми окнами;- высотная отметка конька здания; - историческое объемно-планировочное решение в габаритах капитальных стен;2) Конструктивное решение:- фундаменты (бутовые), наружные и внутренние капитальные стены (известняковая плита);- исторические отметки междуэтажных перекрытий и полов;- опорный столб подклета;- своды перекрытий: коробовые своды и коробовые своды с распалубками в подклете, на первом и втором этажах; полулотковый и лотковый своды первого этажа; сомкнутый свод второго этажа;- переговорный канал из караульного помещения в подклете; - исторические лестницы, их местоположение: лестничные площадки, их объемно-планировочное решение; внутристенные междуэтажные лестницы одно- и двухмаршевые, материал ступеней (известняковая плита); лестница исторического крыльца, материал ступеней (известняковая плита);3) Архитектурно-художественное решение фасадов:- композиционное решение фасадов;- материал и характер отделки фасадных поверхностей;- исторические оконные и дверные проемы, их местоположение, конфигурация, габариты;- белокаменный профилированный венчающий карниз;4) Архитектурно-декоративное оформление интерьеров:- исторические оконные и дверные проемы, их местоположение, конфигурация, габариты;- внутристенные шкафчики и ниши; киот; пристенные лавки; исторические полы в помещениях подклета, ив помещениях первого этажа, материал -  известняковая плита; 5) Детали:- кованые подставы, элементы креплений, связи;- кованая решетка оконного проема 2-го этажа, фрагменты кованой решетки оконного проема подклета;- кованые кольца в сводах.Здание Мешок-II:1) Объемно-пространственное решение:- исторические габариты и конфигурация вытянутого прямоугольного в плане одноэтажного на подклете здания;- историческая форма, габариты и конфигурация двухскатной крыши с печными трубами и слуховыми окнами; - высотная отмет  ${adjusted.toFixed(1)}</b> · сильных факторов: ${strong}, слабых: ${weak}</p>`)}function enrich(group){fetch('/api/enrich?id='+encodeURIComponent(x.object_id)+'&group='+group).then(r=>r.json()).then(data=>{let values=(data.values||[]).map(v=>`<div class=field><b>${esc(v.field)}</b><span>${esc(v.value||'нет данных')} · ${esc(v.verification)} <button onclick="markFactor('${esc(v.field)}','strong')">Сильная сторона</button> <button onclick="markFactor('${esc(v.field)}','weak')">Слабая сторона</button></span></div>`).join('');let links=(data.links||[]).map(v=>`<li><a href="${esc(v.url)}" target="_blank">${esc(v.title)}</a> <small>${esc(v.status)}</small></li>`).join('');document.getElementById('enrichResult').innerHTML=`<h3>Найденные параметры</h3>${values}<h3>Источники для проверки</h3><ul>${links}</ul><p class=muted>${esc(data.note)}</p>`}).catch(()=>document.getElementById('enrichResult').textContent='Поиск временно недоступен')}</script></html>
